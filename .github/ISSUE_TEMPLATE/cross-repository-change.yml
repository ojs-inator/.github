name: Cross-repository or shared-contract change
description: Coordinate work that affects multiple repositories or a shared interface.
title: "[Coordination]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for cross-repository coordination. Implementation remains in the owning repositories. Read the [shared-contract guidance](https://github.com/ojs-inator/kmanweb-roadmap/blob/main/docs/agents/shared-contracts.md) first.
  - type: input
    id: area
    attributes:
      label: Area / shared contract
      placeholder: component upgrade, kw-node payload, bootstrap, migration format, credentials, storage...
    validations:
      required: true
  - type: textarea
    id: repositories
    attributes:
      label: Affected repositories
      description: List owners, providers, and consumers.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract and compatibility
      description: State current behavior, intended change, and compatibility window.
    validations:
      required: true
  - type: textarea
    id: order
    attributes:
      label: Dependencies and merge/release order
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Include focused provider, consumer, and cross-repository checks.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: ADRs, issues, and implementation PRs
      description: Issues, PRs, and ADRs remain the source of truth; the Engineering Project is a dashboard only.
