name: Agent CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale caller runs here. The reusable workflow intentionally owns
# no concurrency group so sibling reusable calls cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ojs-inator/kmanweb-ci/.github/workflows/reusable-agent-ci.yml@main
    with:
      # Replace this with the repository's real validation command.
      command: make test
